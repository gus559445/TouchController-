name: Build TouchController Beta14

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      # 1. 解决 proxy-linux 等桌面模块的交叉编译报错
      - name: 安装系统编译依赖 (搞定 Linux/Windows 模块)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64 g++-mingw-w64

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      # 2. 解决 Gradle 默认编译全架构导致 Rust 找不到 target 的报错
      - name: Setup Rust stable (All targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 3. 解决原版源码 zip 包里漏掉的一张背景图导致的 NullPointerException
      - name: 修复缺失的背景贴图
        run: |
          mkdir -p mod/resources/src/main/resources/texture/background
          cp mod/resources/src/main/resources/icon.png mod/resources/src/main/resources/texture/background/background.png

      # 4. 原汁原味的构建，全自动打包 .so 进根目录
      - name: Gradle编译
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:clean :mod:1.20.1:forge-1.20.1:build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: 输出jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-Beta14-Output
          path: mod/1.20.1/forge-1.20.1/build/libs/*.jar
