name: Build TouchController 1.20.1 Forge (Rust & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      # 重点！恢复解压源码包，把源码释放到工作目录
      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      # 修改 1：使用目前最稳定、未废弃的 Rust 工具链 Action，并直接指定安卓目标
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # 修改 2：增加 Rust 依赖缓存，第二次编译会快非常多！
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: Gradle编译1.20.1 Forge
        run: |
          chmod +x gradlew
          # 注意：请确保这里的模块路径 :mod:1.20.1:forge-1.20.1 与你项目 settings.gradle 里的完全一致
          ./gradlew :mod:1.20.1:forge-1.20.1:build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      # 修改 3：放宽 Jar 路径搜索，防止因为多套了一层文件夹而找不到包
      - name: 输出jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-output
          path: "**/build/libs/*.jar"
