name: Build TouchController Beta14

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      # ---------- 交叉编译环境（原有逻辑保留）----------
      - name: 安装系统编译依赖 (搞定 Linux/Windows 模块)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64 g++-mingw-w64

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Rust stable (All targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: 修复缺失的背景贴图
        run: |
          mkdir -p mod/resources/src/main/resources/texture/background
          cp mod/resources/src/main/resources/icon.png mod/resources/src/main/resources/texture/background/background.png

      # ---------- Gradle 构建（保持原样）----------
      - name: Gradle编译
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:clean :mod:1.20.1:forge-1.20.1:build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      # ★ 新增：方案 A —— 把 14 个 native 库补进主 jar（幂等，缺哪补哪）
      - name: Merge native libs into jar
        run: |
          chmod +x merge_natives.sh
          found=0
          for jar in mod/1.20.1/forge-1.20.1/build/libs/TouchController-*.jar; do
            case "$(basename "$jar")" in
              *-slim-*|*-noreobf-*|*-fat-*) continue ;;
            esac
            found=1
            echo "== 补库: $jar"
            bash merge_natives.sh "$jar" natives
            n=$(unzip -l "$jar" | grep -cE '\.so$|\.dll$')
            [ "$n" -eq 14 ] || { echo "错误: $jar 里库数量是 $n"; exit 1; }
          done
          [ "$found" -eq 1 ] || { echo "错误: 没找到主 jar"; exit 1; }

      - name: 输出jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-Beta14-Output
          path: mod/1.20.1/forge-1.20.1/build/libs/*
