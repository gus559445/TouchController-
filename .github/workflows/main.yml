name: Build TouchController 1.20.1 Forge (Rust & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 核心步骤：编译 Rust 代码
      - name: 编译 Rust 触控底层代码
        run: |
          # 1. 进入包含 Cargo.toml 的 android 目录（根据你截图里有 Cargo.toml 的目录）
          cd proxy-server-android
          
          # 2. 编译 Rust，并输出到 Forge 模块的 resources 目录下
          mkdir -p ../mod/1.20.1/forge-1.20.1/src/main/resources/lib/arm64-v8a
          cargo ndk -t arm64-v8a -o ../mod/1.20.1/forge-1.20.1/src/main/resources/lib/arm64-v8a build --release
          
          # 3. 打印一下文件，确认是否真的生成了
          ls -la ../mod/1.20.1/forge-1.20.1/src/main/resources/lib/arm64-v8a/

      - name: Gradle编译1.20.1 Forge
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:clean :mod:1.20.1:forge-1.20.1:build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: 输出jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-output
          path: mod/1.20.1/forge-1.20.1/build/libs/*.jar
