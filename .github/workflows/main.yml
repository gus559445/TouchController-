name: Build TouchController 1.20.1 Forge (Custom + Android SO)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # ==========新增podman环境 + 构建本地镜像==========
      - name: Install & Start Podman
        run: |
          sudo apt update
          sudo apt install -y podman
          systemctl --user enable --now podman.socket
        env:
          XDG_RUNTIME_DIR: /run/user/$UID

      - name: Build localhost/touchcontroller-linux:latest image
        run: |
          podman build -t localhost/touchcontroller-linux:latest ./proxy-linux
        env:
          DOCKER_HOST: unix://$XDG_RUNTIME_DIR/podman/podman.sock

      - name: Gradle编译完整正式包(reobfJar)
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:reobfJar --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"
          # 传递podman socket给gradle进程
          DOCKER_HOST: unix://$XDG_RUNTIME_DIR/podman/podman.sock

      - name: Gradle编译slim包(提取Android SO)
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:jar --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"
          DOCKER_HOST: unix://$XDG_RUNTIME_DIR/podman/podman.sock

      - name: 提取slim包中的Android SO，合并进正式包
        run: |
          # 找到正式包和slim包
          FULL_JAR=$(find mod/1.20.1/forge-1.20.1/build/libs -name "*.jar" ! -name "*-slim.jar" ! -name "*-sources.jar")
          SLIM_JAR=$(find mod/1.20.1/forge-1.20.1/build/libs -name "*-slim.jar")
          echo "正式包: $FULL_JAR"
          echo "Slim包: $SLIM_JAR"

          # 解压slim包，只提取native目录
          mkdir -p tmp_extract
          cd tmp_extract
          unzip -q ../$SLIM_JAR "META-INF/native/**"
          # 把native目录追加进正式包
          jar uf ../$FULL_JAR META-INF/native
          cd ..
          rm -rf tmp_extract

          echo "合并完成，最终包: $FULL_JAR"
          # 验证native是否真的打进去了
          unzip -l $FULL_JAR | grep "META-INF/native" | head -10

      - name: 输出最终jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-custom-1.20.1
          path: "mod/1.20.1/forge-1.20.1/build/libs/*.jar"
