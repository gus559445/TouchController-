name: Build TouchController 0.2 Full Official Build (with Podman)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source.zip
        run: unzip source.zip

      - name: Move source files to root
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      - name: Setup JDK21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK r25c
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # =====核心修复：手动启动podman socket，不使用systemctl --user=====
      - name: Start rootless podman socket manually
        run: |
          mkdir -p $XDG_RUNTIME_DIR/podman
          podman system service --time=0 unix://$XDG_RUNTIME_DIR/podman/podman.sock &
          sleep 10
          export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
          echo "DOCKER_HOST=$DOCKER_HOST" >> $GITHUB_ENV

      - name: Official build command ./gradlew build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-full-build-beta15
          path: |
            mod/1.20.1/forge-1.20.1/build/libs/*.jar
            proxy-server-android/build/libs/*.so
