name: Build TouchController Beta14

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 解压 source.zip
        run: unzip source.zip

      - name: 将源码移动到工作根目录
        run: |
          innerdir=$(unzip -qql source.zip | head -1 | awk '{print $4}' | cut -d/ -f1)
          if [ -n "$innerdir" ] && [ -d "$innerdir" ];then
            mv ./$innerdir/* ./
          fi

      # 环境配置保留（虽然没用，但防错）
      - name: 安装系统编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-mingw-w64 g++-mingw-w64 zip

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: 生成local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: 修复缺失的背景贴图
        run: |
          mkdir -p mod/resources/src/main/resources/texture/background
          cp mod/resources/src/main/resources/icon.png mod/resources/src/main/resources/texture/background/background.png

      - name: Gradle编译
        run: |
          chmod +x gradlew
          ./gradlew :mod:1.20.1:forge-1.20.1:clean :mod:1.20.1:forge-1.20.1:build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: "-Xmx4G"

      # ★ 核心黑科技：从旧 Jar 里抽库，塞进新 Jar
      - name: 从旧 jar 提取库并注入新 jar
        run: |
          echo "正在从 old.jar 中提取 .so 和 .dll 文件..."
          mkdir -p temp_natives
          # 提取库文件，保留内部目录结构
          unzip -o old.jar '*.so' '*.dll' -d temp_natives
          
          # 遍历新编译出来的 jar
          for jar in mod/1.20.1/forge-1.20.1/build/libs/TouchController-*.jar; do
            case "$(basename "$jar")" in
              *-slim-*|*-noreobf-*|*-fat-*) continue ;;
            esac
            echo "== 正在向 $jar 注入原生库..."
            # 进入提取出来的库文件夹，利用 zip 直接更新到新 jar 中
            (cd temp_natives && zip -r -u "$GITHUB_WORKSPACE/$jar" .)
            
            # 统计验证
            n=$(unzip -l "$jar" | grep -cE '\.so$|\.dll$')
            echo "✅ 注入成功！当前 $jar 中的库数量为: $n"
            if [ "$n" -eq 0 ]; then
              echo "错误: 注入失败，库数量为 0"
              exit 1
            fi
          done

      - name: 输出jar产物
        uses: actions/upload-artifact@v4
        with:
          name: TouchController-Output
          path: mod/1.20.1/forge-1.20.1/build/libs/*
